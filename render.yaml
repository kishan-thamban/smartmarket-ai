services:
  - type: web
    name: smartmarketai-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://your-frontend-url.vercel.app # Update this with your actual frontend URL

  - type: static
    name: smartmarketai-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartmarketai-backend.onrender.com # Auto-populated or set manually
